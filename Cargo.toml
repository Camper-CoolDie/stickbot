[package]
name = "stickbot"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0"
futures = "0.3"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "signal"] }
tokio-util = "0.7"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.bonfire]
git = "https://github.com/Camper-CoolDie/bonfire-rust"
rev = "0297ee15f5b083d6137c82102e9b77fe041e068d"
features = ["fcm", "serde"]

[build-dependencies]
anyhow = "1.0"
toml = "1.2"
